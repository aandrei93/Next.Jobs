name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_SECRET: ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      HOUSEKEEPING_SECRET: ci-housekeeping-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Ensure clean SQLite state
        run: rm -f prisma/ci.db prisma/dev.db prisma/prisma/dev.db

      - name: Prisma validate
        run: npm run prisma:validate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Prisma migration status
        run: npm run prisma:migrate:status

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
