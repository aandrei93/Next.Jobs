name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["master", "main"]

jobs:
  preview-deploy:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: file:./preview.db
      NEXTAUTH_SECRET: preview-secret
      NEXTAUTH_URL: https://preview.local
      NEXT_PUBLIC_APP_URL: https://preview.local
      HOUSEKEEPING_SECRET: preview-housekeeping-secret
    steps:
      - name: Detect preview configuration
        id: config
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.config.outputs.enabled == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel env
        if: steps.config.outputs.enabled == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview
        if: steps.config.outputs.enabled == 'true'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: steps.config.outputs.enabled == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.config.outputs.enabled == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Preview deployment is ready: ${{ steps.deploy.outputs.url }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Preview skipped
        if: steps.config.outputs.enabled != 'true'
        run: echo "Skipping preview deploy. Configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets."
